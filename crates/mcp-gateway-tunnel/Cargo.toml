[package]
name = "mcp-gateway-tunnel"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MCP Gateway tunnel client. Dials the relay and forwards /mcp to a local server."
repository.workspace = true
homepage.workspace = true

# The only binary in this crate is the stdio test double. The published
# `mcp-gateway` binary lives in mcp-gateway-cli and already includes `tunnel`.
# Leaving this package distable makes cargo-dist emit a second app that
# overwrites Formula/mcp-gateway.rb with an installer for stdio_fixture.
[package.metadata.dist]
dist = false

[[bin]]
name = "stdio_fixture"
path = "src/bin/stdio_fixture.rs"
test = false
doc = false

[dependencies]
mcp-gateway-tunnel-proto.workspace = true
mcp-gateway-proxy.workspace = true
axum = { workspace = true, features = ["ws", "json"] }
base64.workspace = true
bytes.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
http.workspace = true
http-body-util.workspace = true
rand.workspace = true
reqwest = { workspace = true, features = ["stream"] }
serde_json.workspace = true
subtle.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tokio-util.workspace = true
tower.workspace = true
url.workspace = true

[dev-dependencies]
axum = { workspace = true, features = ["ws"] }
base64.workspace = true
bytes.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http.workspace = true
mcp-gateway-tunnel-proto.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["test-util", "macros"] }

[lints]
workspace = true

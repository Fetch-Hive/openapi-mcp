[workspace]
resolver = "2"
members = [
  "crates/mcp-gateway-ir",
  "crates/mcp-gateway-compile",
  "crates/mcp-gateway-proxy",
  "crates/mcp-gateway-server",
  "crates/mcp-gateway-cli",
  "crates/mcp-gateway-upsell",
]

[workspace.package]
edition = "2021"
version = "0.5.0"
license = "Apache-2.0"
repository = "https://github.com/Fetch-Hive/openapi-mcp"
homepage = "https://github.com/Fetch-Hive/openapi-mcp"
authors = ["Fetch Hive"]

[workspace.dependencies]
mcp-gateway-ir = { path = "crates/mcp-gateway-ir" }
mcp-gateway-compile = { path = "crates/mcp-gateway-compile" }
mcp-gateway-proxy = { path = "crates/mcp-gateway-proxy" }
mcp-gateway-server = { path = "crates/mcp-gateway-server" }
mcp-gateway-upsell = { path = "crates/mcp-gateway-upsell" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
schemars = "1.0"
jsonschema = { version = "0.51", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "json", "charset"] }
url = "2"
serde_yaml = "0.9"
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["limit", "timeout", "util"] }
tower-http = { version = "0.6", features = ["trace", "timeout", "limit", "catch-panic", "sensitive-headers"] }
rmcp = { version = "3.1", default-features = false, features = ["server", "transport-streamable-http-server", "transport-streamable-http-server-session"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio", "server"] }
http-body-util = "0.1"
bytes = "1"
http = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = "1"
webpki-roots = "0.26"
hickory-resolver = { version = "0.25", features = ["tokio"] }
ipnet = "2.9"
idna = "1"
secrecy = { version = "0.10", features = ["serde"] }
zeroize = "1"
subtle = "2"
sha2 = "0.10"
hex = "0.4"
hmac = "0.12"
base64 = "0.22"
jsonwebtoken = "9"
arc-swap = "1"
moka = { version = "0.12", features = ["future"] }
redis = { version = "0.32", features = ["tokio-comp", "connection-manager"] }
sentry = { version = "0.34", default-features = false, features = ["backtrace", "contexts", "panic", "tracing", "reqwest", "rustls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = "0.32"
opentelemetry_sdk = { version = "0.32", features = ["rt-tokio"] }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "reqwest-client"] }
tracing-opentelemetry = "0.32"
uuid = { version = "1", features = ["v4", "serde"] }
flate2 = "1"
brotli = "8"
percent-encoding = "2"
async-trait = "0.1"
aes-gcm = "0.10"
rand = "0.8"
dashmap = "6"
tokio-stream = "0.1"
clap = { version = "4", features = ["derive", "env", "wrap_help"] }
clap_complete = "4"
toml = "0.8"
directories = "6"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }

# cargo-dist builds with `--profile dist`. `dist init` would have written this.
[profile.dist]
inherits = "release"
lto = "thin"

[workspace.lints.rust]
unused = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

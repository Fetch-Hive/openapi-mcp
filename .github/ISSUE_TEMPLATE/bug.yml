name: Bug report
description: Something does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Search existing issues first. Security reports go to SECURITY.md, not here.
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Commands, config.toml (redact secrets), and `mcp-gateway version --json`.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: mcp-gateway version
    validations:
      required: true

# Publishes the release artifacts cargo-dist does not:
#   ghcr.io/fetch-hive/mcp-gateway:X.Y.Z  (and :latest on a stable release)
#   @fetch-hive/mcp-gateway on npm
#
# Runs after the GitHub Release exists. Both jobs use the binaries that
# Release already uploaded. The image does not compile Rust.
#
# Repository secret NPM_TOKEN: an npm Automation token that can publish
# @fetch-hive/*. GHCR uses this workflow's GITHUB_TOKEN (packages: write).

name: Publish packages

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

jobs:
  ghcr:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      # Runtime Dockerfile lives on the branch you run from. v0.6.0 was tagged
      # before it existed, so a dispatch of that tag must not check out the tag.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: tags
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail
          owner="$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          version="${TAG#v}"
          image="ghcr.io/${owner}/mcp-gateway"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"
          if [[ "$PRERELEASE" != "true" && "$version" != *-* ]]; then
            echo "latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "latest=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Stage release binaries
        id: stage
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          work="${RUNNER_TEMP}/mcp-release"
          mkdir -p "$work"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern 'mcp-gateway-cli-*-unknown-linux-musl.tar.xz' \
            --dir "$work"
          stage_one() {
            local triple="$1"
            local arch="$2"
            local dir="${RUNNER_TEMP}/mcp-image-${arch}"
            mkdir -p "$dir"
            tar -xJf "$work/mcp-gateway-cli-${triple}.tar.xz" -C "$work"
            install -m 755 "$work/mcp-gateway-cli-${triple}/mcp-gateway" "$dir/mcp-gateway"
            cp docker/Dockerfile.runtime "$dir/Dockerfile"
            echo "${arch}=${dir}" >> "$GITHUB_OUTPUT"
          }
          stage_one x86_64-unknown-linux-musl amd64
          stage_one aarch64-unknown-linux-musl arm64

      - name: Push linux/amd64
        id: amd64
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.stage.outputs.amd64 }}
          platforms: linux/amd64
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
          outputs: type=image,name=${{ steps.tags.outputs.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Push linux/arm64
        id: arm64
        uses: docker/build-push-action@v6
        with:
          context: ${{ steps.stage.outputs.arm64 }}
          platforms: linux/arm64
          provenance: false
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}
          outputs: type=image,name=${{ steps.tags.outputs.image }},push-by-digest=true,name-canonical=true,push=true

      - name: Publish multi-arch manifest
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          VERSION: ${{ steps.tags.outputs.version }}
          LATEST: ${{ steps.tags.outputs.latest }}
        run: |
          set -euo pipefail
          args=(-t "${IMAGE}:${VERSION}")
          if [[ "$LATEST" == "true" ]]; then
            args+=(-t "${IMAGE}:latest")
          fi
          docker buildx imagetools create "${args[@]}" \
            "${IMAGE}@${{ steps.amd64.outputs.digest }}" \
            "${IMAGE}@${{ steps.arm64.outputs.digest }}"

  npm:
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && startsWith(inputs.tag, 'v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # Pack script lives on the branch you run from. v0.6.0 was tagged
      # before that script existed, so a dispatch of that tag must not
      # check out the tag. Release events are tagged after the script is committed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Publish npm packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: node scripts/publish-npm.mjs --publish --version "$TAG"
